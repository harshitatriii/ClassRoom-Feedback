databases:
  - name: smartclassroom-db
    plan: free
    databaseName: smartclassroom
    user: smartclassroom

services:
  - type: web
    name: smartclassroom-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn smartClassroom.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartclassroom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-url.onrender.com"
